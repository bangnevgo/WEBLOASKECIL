<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#070709;">
  <defs>
    <!-- Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a1f10" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#14100b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#080706" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040405" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="brainGlow" cx="50%" cy="32%" r="22%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#78350f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="heartGlow" cx="50%" cy="56%" r="20%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#b45309" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#78350f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="goldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d4a053" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#spaceGlow)"/>

  <!-- Grid / Scientific Neural Coordinates Overlay -->
  <g opacity="0.12" stroke="#d4a053" stroke-width="0.75">
    <circle cx="640" cy="360" r="140" fill="none" stroke-dasharray="3,6"/>
    <circle cx="640" cy="360" r="240" fill="none" stroke-dasharray="4,8"/>
    <circle cx="640" cy="360" r="340" fill="none" stroke-dasharray="2,10"/>
    <line x1="640" y1="40" x2="640" y2="680" stroke-dasharray="4,8"/>
    <line x1="180" y1="360" x2="1100" y2="360" stroke-dasharray="4,8"/>
    <line x1="390" y1="120" x2="890" y2="600" stroke-dasharray="2,12"/>
    <line x1="390" y1="600" x2="890" y2="120" stroke-dasharray="2,12"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="640" cy="220" r="220" fill="url(#brainGlow)"/>
  <circle cx="640" cy="410" r="180" fill="url(#heartGlow)"/>

  <!-- Body Silhouette (Head, Neck, Torso, Arms) -->
  <g opacity="0.25" fill="#17120a" stroke="#d4a053" stroke-width="1.2" stroke-opacity="0.4">
    <!-- Torso & Shoulders -->
    <path d="M 440 680 C 445 560 480 470 535 440 C 555 430 560 380 560 350 L 570 320 C 570 320 545 310 540 270 C 530 250 530 190 560 140 C 590 100 640 90 640 90 C 640 90 690 100 720 140 C 750 190 750 250 740 270 C 735 310 710 320 710 320 L 720 350 C 720 380 725 430 745 440 C 800 470 835 560 840 680 Z"/>
    <!-- Outer Arms Accent -->
    <path d="M 440 680 C 430 590 470 510 515 465" fill="none" stroke="#d4a053" stroke-width="1" stroke-dasharray="2,4"/>
    <path d="M 840 680 C 850 590 810 510 765 465" fill="none" stroke="#d4a053" stroke-width="1" stroke-dasharray="2,4"/>
  </g>

  <!-- Central Nervous System & Spinal Column (Spine) -->
  <g filter="url(#superGlow)">
    <!-- Core Spinal Cord -->
    <line x1="640" y1="220" x2="640" y2="640" stroke="url(#goldBeam)" stroke-width="5" stroke-linecap="round"/>
    <line x1="640" y1="220" x2="640" y2="640" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Vertebrae / Somatic Energy Nodes along Spine -->
  <g filter="url(#softGlow)" fill="#fef08a" stroke="#d97706" stroke-width="1.5">
    <circle cx="640" cy="240" r="5"/>
    <circle cx="640" cy="275" r="5.5"/>
    <circle cx="640" cy="310" r="6"/>
    <circle cx="640" cy="350" r="7"/>
    <circle cx="640" cy="395" r="8"/> <!-- Heart/Somatic Center -->
    <circle cx="640" cy="445" r="7"/>
    <circle cx="640" cy="495" r="6.5"/>
    <circle cx="640" cy="545" r="6"/>
    <circle cx="640" cy="595" r="5.5"/>
  </g>

  <!-- Brain & Cerebral Synaptic Network -->
  <g filter="url(#superGlow)">
    <!-- Brain Outer Contour Glow -->
    <path d="M 640 120 C 585 120 550 160 555 210 C 560 250 590 270 640 275 C 690 270 720 250 725 210 C 730 160 695 120 640 120 Z" 
          fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.75"/>

    <!-- Left & Right Brain Lobes -->
    <path d="M 640 130 C 600 135 570 165 575 205 C 580 235 605 255 640 260" 
          fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.9"/>
    <path d="M 640 130 C 680 135 710 165 705 205 C 700 235 675 255 640 260" 
          fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.9"/>

    <!-- Neural Sulci & Gyri Curves (Brain folds) -->
    <path d="M 590 160 Q 615 175 600 200 Q 625 215 610 240" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
    <path d="M 690 160 Q 665 175 680 200 Q 655 215 670 240" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
    <path d="M 640 145 Q 625 180 640 215 Q 655 235 640 255" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
  </g>

  <!-- Brain Synaptic Sparks (Neural Firing) -->
  <g filter="url(#softGlow)" fill="#ffffff">
    <circle cx="585" cy="175" r="2.5"/>
    <circle cx="615" cy="155" r="2"/>
    <circle cx="665" cy="155" r="2"/>
    <circle cx="695" cy="175" r="2.5"/>
    <circle cx="575" cy="215" r="2"/>
    <circle cx="705" cy="215" r="2"/>
    <circle cx="620" cy="225" r="3"/>
    <circle cx="660" cy="225" r="3"/>
    <circle cx="640" cy="190" r="3.5" fill="#fef08a"/>
  </g>

  <!-- Peripheral Nervous System (Spreading Neural Fibers) -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#goldWire)" stroke-width="1.4">
    <!-- Cervical Plexus (Neck to Shoulders) -->
    <path d="M 640 275 Q 570 300 520 330 Q 475 365 445 420"/>
    <path d="M 640 275 Q 710 300 760 330 Q 805 365 835 420"/>
    <path d="M 640 310 Q 550 335 490 380 Q 450 430 425 500"/>
    <path d="M 640 310 Q 730 335 790 380 Q 830 430 855 500"/>

    <!-- Brachial Plexus (Arms/Torso) -->
    <path d="M 640 350 Q 560 380 500 440 Q 460 500 435 600"/>
    <path d="M 640 350 Q 720 380 780 440 Q 820 500 845 600"/>

    <!-- Thoracic & Somatic Heart Radiance (Emotions & Habitual Feelings) -->
    <path d="M 640 395 C 570 395 530 425 490 475 C 465 520 450 580 440 660"/>
    <path d="M 640 395 C 710 395 750 425 790 475 C 815 520 830 580 840 660"/>
    <path d="M 640 445 Q 570 460 525 510 Q 490 565 480 650"/>
    <path d="M 640 445 Q 710 460 755 510 Q 790 565 800 650"/>

    <!-- Lumbar & Sciatic Roots (Grounding) -->
    <path d="M 640 495 Q 590 525 555 580 Q 535 620 525 680"/>
    <path d="M 640 495 Q 690 525 725 580 Q 745 620 755 680"/>
    <path d="M 640 545 Q 600 580 575 640 L 565 680"/>
    <path d="M 640 545 Q 680 580 705 640 L 715 680"/>
  </g>

  <!-- Somatic Energy Vortex / Electromagnetic Heart Field -->
  <g filter="url(#superGlow)" opacity="0.6">
    <ellipse cx="640" cy="395" rx="85" ry="40" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,6"/>
    <ellipse cx="640" cy="395" rx="140" ry="70" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,8"/>
    <ellipse cx="640" cy="395" rx="200" ry="105" fill="none" stroke="#b45309" stroke-width="0.75" stroke-dasharray="2,12"/>
  </g>

  <!-- Floating Biophotons / Synaptic Energy Particles -->
  <g fill="#fef08a" opacity="0.75">
    <circle cx="510" cy="340" r="1.5"/>
    <circle cx="470" cy="390" r="2"/>
    <circle cx="430" cy="470" r="1.5"/>
    <circle cx="770" cy="340" r="1.5"/>
    <circle cx="810" cy="390" r="2"/>
    <circle cx="850" cy="470" r="1.5"/>
    <circle cx="530" cy="450" r="2"/>
    <circle cx="750" cy="450" r="2"/>
    <circle cx="500" cy="530" r="1.5"/>
    <circle cx="780" cy="530" r="1.5"/>
    <circle cx="540" cy="620" r="2"/>
    <circle cx="740" cy="620" r="2"/>
    <circle cx="340" cy="240" r="1" opacity="0.4"/>
    <circle cx="940" cy="240" r="1" opacity="0.4"/>
    <circle cx="310" cy="480" r="1.2" opacity="0.3"/>
    <circle cx="970" cy="480" r="1.2" opacity="0.3"/>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="1280" height="720" fill="none" stroke="#d4a053" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="16" y="16" width="1248" height="688" fill="none" stroke="#d4a053" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Minimal Corner Accents -->
  <path d="M 28 48 L 28 28 L 48 28" fill="none" stroke="#d4a053" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1252 48 L 1252 28 L 1232 28" fill="none" stroke="#d4a053" stroke-width="1.5" opacity="0.6"/>
  <path d="M 28 672 L 28 692 L 48 692" fill="none" stroke="#d4a053" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1252 672 L 1252 692 L 1232 692" fill="none" stroke="#d4a053" stroke-width="1.5" opacity="0.6"/>

  <!-- Elegant Bottom Title Badge (Overlay) -->
  <g transform="translate(640, 642)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#0c0b0a" fill-opacity="0.85" stroke="#d4a053" stroke-width="1" stroke-opacity="0.4"/>
    <text text-anchor="middle" y="5" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="3">
      ✦ MEMORI BIOLOGIS &amp; SISTEM SARAF SOMATIS ✦
    </text>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(640, 52)">
    <text text-anchor="middle" fill="#d4a053" font-family="monospace" font-size="11" font-weight="600" letter-spacing="4" opacity="0.9">
      AUDIO MASTERCLASS • LAW OF ASSUMPTION
    </text>
  </g>
</svg>
