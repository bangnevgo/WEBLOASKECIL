<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>TikTok iPad Pro Apple Studio Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at 50% 25%, #18141d 0%, #0c0910 50%, #040305 100%);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
    }

    /* Ambient Warm Gold Backlight */
    .ambient-light {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 700px;
      background: radial-gradient(circle, rgba(212, 160, 83, 0.25) 0%, rgba(212, 160, 83, 0.06) 50%, transparent 75%);
      filter: blur(60px);
      pointer-events: none;
    }

    .desk-reflection-base {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(25, 20, 30, 0.3) 0%, rgba(8, 6, 10, 0.95) 100%);
      border-top: 1px solid rgba(212, 160, 83, 0.12);
      pointer-events: none;
    }

    /* Camera Motion Stage */
    .camera-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 48%;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* iPad Pro Hardware Chassis */
    /* Exact 834 x 1194 aspect ratio scaled to width 780px -> height = 1116px */
    .ipad-device {
      position: relative;
      width: 780px;
      height: 1116px;
      background: #1c1c22;
      border-radius: 44px;
      padding: 16px;
      border: 3px solid #2e2e38;
      box-shadow: 
        0 45px 120px rgba(0, 0, 0, 0.95),
        0 0 70px rgba(212, 160, 83, 0.3),
        inset 0 0 3px rgba(255, 255, 255, 0.25);
    }

    /* iPad Screen Display Glass */
    .ipad-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #060608;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
    }

    /* Native Clean Screen Video */
    .ipad-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Screen Glass Sheen */
    .ipad-sheen {
      position: absolute;
      top: -30%;
      right: -30%;
      width: 80%;
      height: 160%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 60%);
      transform: rotate(25deg);
      pointer-events: none;
    }

    /* Zoom Camera States */
    .zoom-1 {
      transform: scale(1) translateY(20px);
    }

    .zoom-2 {
      transform: scale(1.32) translateY(-30px);
    }

    .zoom-3 {
      transform: scale(1.58) translateY(-80px);
    }

    /* Top & Bottom Kinetic HUD (TikTok Safe Zone) */
    .overlay-hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 95px 48px 230px 48px;
      text-align: center;
    }

    .hud-top, .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .kinetic-badge {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d4a053;
      background: rgba(8, 8, 12, 0.92);
      border: 1.5px solid rgba(212, 160, 83, 0.6);
      box-shadow: 0 8px 24px rgba(0,0,0,0.85), 0 0 20px rgba(212, 160, 83, 0.35);
      padding: 10px 28px;
      border-radius: 999px;
      margin-bottom: 14px;
      backdrop-filter: blur(14px);
    }

    .kinetic-card {
      background: rgba(8, 8, 12, 0.94);
      border: 2px solid rgba(212, 160, 83, 0.4);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 40px rgba(212, 160, 83, 0.35);
      backdrop-filter: blur(16px);
      border-radius: 26px;
      padding: 24px 34px;
      max-width: 980px;
      width: 100%;
    }

    .kinetic-title {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .gold-glow {
      color: #ffd700;
      background: linear-gradient(135deg, #ffe066 0%, #d4a053 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(212, 160, 83, 0.6));
    }

    .kinetic-sub {
      font-size: 25px;
      font-weight: 700;
      color: #d1d5db;
      margin-top: 8px;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <div class="ambient-light"></div>
  <div class="desk-reflection-base"></div>

  <div id="cameraStage" class="camera-stage zoom-1">
    <!-- Apple iPad Pro Frame -->
    <div class="ipad-device">
      <div class="ipad-screen">
        <!-- Native Clean Screen Video in 834 x 1194 -->
        <video id="ipadVideo" src="clean_ipad_screen_native.mp4" muted autoplay playsinline loop></video>
        <div class="ipad-sheen"></div>
      </div>
    </div>
  </div>

  <div class="overlay-hud">
    <div class="hud-top">
      <div id="kineticBadge" class="kinetic-badge">01 • HOOK</div>
      <div class="kinetic-card">
        <div id="kineticTitle" class="kinetic-title">
          Belajar Manifestasi<br><span class="gold-glow">JANGAN CUMA DARI POTONGAN KONTEN</span>
        </div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="kinetic-card">
        <div id="kineticSub" class="kinetic-sub">
          Akses kurikulum terstruktur langsung di website resmi LOAS
        </div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('cameraStage');
    const badge = document.getElementById('kineticBadge');
    const title = document.getElementById('kineticTitle');
    const sub = document.getElementById('kineticSub');
    const vid = document.getElementById('ipadVideo');

    const timeline = [
      {
        t: 0,
        zoom: 'zoom-1',
        badge: '01 • HOOK',
        title: 'Belajar Manifestasi<br><span class="gold-glow">JANGAN CUMA DARI POTONGAN KONTEN</span>',
        sub: 'Buka kurikulum terstruktur langsung di website resmi LOAS'
      },
      {
        t: 3,
        zoom: 'zoom-2',
        badge: '02 • MASALAH 1',
        title: 'Banyak orang <span class="gold-glow">langsung praktik…</span>',
        sub: 'Tanpa memahami fondasi dasarnya dengan tepat'
      },
      {
        t: 6,
        zoom: 'zoom-2',
        badge: '03 • MASALAH 2',
        title: 'Tapi tidak memahami<br><span class="gold-glow">TEORINYA DENGAN BENAR</span>',
        sub: 'Hanya mengandalkan potongan video pendek di medsos'
      },
      {
        t: 10,
        zoom: 'zoom-1',
        badge: '04 • KONSEKUENSI',
        title: 'Saat muncul hambatan...',
        sub: 'Akhirnya bingung harus bagaimana & berhenti di tengah jalan'
      },
      {
        t: 13,
        zoom: 'zoom-2',
        badge: '05 • PEMBEDA',
        title: 'Disusun dari<br><span class="gold-glow">PENGALAMAN MEMBIMBING</span>',
        sub: 'Bukan sekadar rangkuman teori buku'
      },
      {
        t: 18,
        zoom: 'zoom-3',
        badge: '06 • KURIKULUM',
        title: '<span class="gold-glow">10 MODUL • 49 PELAJARAN</span>',
        sub: 'Tersusun bertahap & terstruktur dari dasar hingga mahir'
      },
      {
        t: 23,
        zoom: 'zoom-2',
        badge: '07 • PENAWARAN',
        title: 'Dapatkan<br><span class="gold-glow">FREE AKSES KE SELURUH MATERI</span>',
        sub: 'Buka semua modul pembelajaran tanpa biaya'
      },
      {
        t: 26,
        zoom: 'zoom-3',
        badge: '08 • DAFTAR SEKARANG',
        title: '👉 <span class="gold-glow">KLIK LINK DI BIO</span>',
        sub: 'Daftar Free → Langsung Buka 10 Modul & 49 Pelajaran'
      }
    ];

    function checkTime() {
      const cur = vid.currentTime;
      for (let i = timeline.length - 1; i >= 0; i--) {
        if (cur >= timeline[i].t) {
          const item = timeline[i];
          stage.className = 'camera-stage ' + item.zoom;
          badge.textContent = item.badge;
          title.innerHTML = item.title;
          sub.innerHTML = item.sub;
          break;
        }
      }
      requestAnimationFrame(checkTime);
    }
    requestAnimationFrame(checkTime);
  </script>
</body>
</html>
